name: Rebuild tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline rebuild tests
        run: python -m unittest discover -s tests/rebuild -p "test_*.py" -v
